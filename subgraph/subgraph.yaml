specVersion: 0.0.5
schema:
  file: ./schema.graphql

dataSources:
  # PositionVault Contract - tracks position lifecycle
  - kind: ethereum/contract
    name: PositionVault
    network: base-sepolia # Base Sepolia testnet
    source:
      address: "0x0000000000000000000000000000000000000000" # PLACEHOLDER - Update after deployment
      abi: PositionVault
      startBlock: 0 # PLACEHOLDER - Update with deployment block number
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Position
        - User
        - Token
        - GlobalStats
        - DailyStats
      abis:
        - name: PositionVault
          file: ./abis/PositionVault.json
      eventHandlers:
        - event: PositionCreated(indexed bytes32,indexed address,address,uint256,address,uint256,uint256)
          handler: handlePositionCreated
        - event: PositionUpdated(indexed bytes32,uint256,uint256,uint256)
          handler: handlePositionUpdated
        - event: HealthFactorUpdated(indexed bytes32,uint256,uint256)
          handler: handleHealthFactorUpdated
        - event: CollateralAdded(indexed bytes32,uint256,uint256)
          handler: handleCollateralAdded
        - event: DebtRepaid(indexed bytes32,uint256,uint256)
          handler: handleDebtRepaid
      file: ./src/mapping.ts

  # Protector Contract - tracks protection actions
  - kind: ethereum/contract
    name: Protector
    network: base-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000" # PLACEHOLDER - Update after deployment
      abi: Protector
      startBlock: 0 # PLACEHOLDER - Update with deployment block number
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - ProtectionAction
        - Position
        - RiskEvent
        - GlobalStats
        - DailyStats
      abis:
        - name: Protector
          file: ./abis/Protector.json
        - name: PositionVault
          file: ./abis/PositionVault.json
      eventHandlers:
        - event: ProtectionExecuted(indexed bytes32,uint256,uint256,uint256)
          handler: handleProtectionExecuted
        - event: ProtectionFailed(indexed bytes32,string)
          handler: handleProtectionFailed
      file: ./src/mapping.ts

  # DemoEscrow Contract - tracks escrow operations
  - kind: ethereum/contract
    name: DemoEscrow
    network: base-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000" # PLACEHOLDER - Update after deployment
      abi: DemoEscrow
      startBlock: 0 # PLACEHOLDER - Update with deployment block number
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - ProtectionAction
        - GlobalStats
      abis:
        - name: DemoEscrow
          file: ./abis/DemoEscrow.json
      eventHandlers:
        - event: Deposited(indexed address,indexed address,uint256)
          handler: handleDeposited
        - event: Withdrawn(indexed address,indexed address,address,uint256)
          handler: handleWithdrawn
        - event: ProtectorAuthorized(indexed address)
          handler: handleProtectorAuthorized
        - event: ProtectorUnauthorized(indexed address)
          handler: handleProtectorUnauthorized
      file: ./src/mapping.ts

# Templates for dynamically added contracts (future feature)
templates:
  # Template for tracking additional position vaults
  - kind: ethereum/contract
    name: PositionVaultTemplate
    network: base-sepolia
    source:
      abi: PositionVault
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Position
        - User
        - GlobalStats
      abis:
        - name: PositionVault
          file: ./abis/PositionVault.json
      eventHandlers:
        - event: PositionCreated(indexed bytes32,indexed address,address,uint256,address,uint256,uint256)
          handler: handlePositionCreated
        - event: PositionUpdated(indexed bytes32,uint256,uint256,uint256)
          handler: handlePositionUpdated
        - event: HealthFactorUpdated(indexed bytes32,uint256,uint256)
          handler: handleHealthFactorUpdated
      file: ./src/mapping.ts

# Features configuration
features:
  - grafting # Enable grafting for subgraph upgrades
  - nonFatalErrors # Continue indexing on non-fatal errors
  - ipfsOnEthereumContracts # Support IPFS contract metadata
