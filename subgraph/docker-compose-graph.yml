version: '3'
services:
  graph-node:
    image: graphprotocol/graph-node:latest
    ports:
      - '8000:8000'  # GraphQL HTTP server
      - '8001:8001'  # GraphQL WebSocket server
      - '8020:8020'  # JSON-RPC admin server
      - '8030:8030'  # Subgraph indexing status
      - '8040:8040'  # Metrics
    depends_on:
      - ipfs
      - postgres
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      postgres_host: postgres
      postgres_user: graph-node
      postgres_pass: let-me-in
      postgres_db: graph-node
      ipfs: 'ipfs:5001'
      # For Base Sepolia testnet - update with your RPC endpoint
      ethereum: 'base-sepolia:https://sepolia.base.org'
      # Alternative: use local Anvil node
      # ethereum: 'base-sepolia:http://host.docker.internal:8545'
      GRAPH_LOG: info
      GRAPH_ALLOW_NON_DETERMINISTIC_IPFS: 'true'
      ETHEREUM_REORG_THRESHOLD: 1
      ETHEREUM_ANCESTOR_COUNT: 1

  ipfs:
    image: ipfs/kubo:latest
    ports:
      - '5001:5001'  # IPFS API
      - '5002:5002'  # IPFS Gateway
    volumes:
      - ./data/ipfs:/data/ipfs
    environment:
      IPFS_PROFILE: server

  postgres:
    image: postgres:14
    ports:
      - '5432:5432'
    command:
      [
        "postgres",
        "-cshared_preload_libraries=pg_stat_statements",
        "-cmax_connections=200"
      ]
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: let-me-in
      POSTGRES_DB: graph-node
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

volumes:
  postgres:
  ipfs:
