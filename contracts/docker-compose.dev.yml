version: '3.8'

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:nightly
    command: anvil --host 0.0.0.0 --port 8545
    ports:
      - "8545:8545"
    networks:
      - foundry-net

  foundry:
    image: ghcr.io/foundry-rs/foundry:nightly
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - foundry-net
    depends_on:
      - anvil
    environment:
      - RPC_URL=http://anvil:8545
    command: sleep infinity

networks:
  foundry-net:
    driver: bridge